name: caja-chica-docker

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: caja-chica-app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: caja_chica_demo
      DB_USERNAME: caja_user
      DB_PASSWORD: demo_password_2026
    depends_on:
      - db

  db:
    image: mariadb:10.4.32
    container_name: caja-chica-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root_demo_2026
      MARIADB_DATABASE: caja_chica_demo
      MARIADB_USER: caja_user
      MARIADB_PASSWORD: demo_password_2026
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
